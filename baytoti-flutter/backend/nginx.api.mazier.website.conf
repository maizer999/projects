# /etc/nginx/sites-available/api.mazier.website
# Symlink into /etc/nginx/sites-enabled/ then run `sudo nginx -t && sudo systemctl reload nginx`.
# Let's Encrypt (certbot --nginx -d api.mazier.website) will add the SSL server block automatically
# and rewrite port 80 to redirect.

server {
    listen 80;
    listen [::]:80;
    server_name api.mazier.website;

    root /var/www/baytoti-api;
    index index.php;

    client_max_body_size 1m;

    # Single-entry router: all paths flow through index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Deny access to config and dotfiles.
    location ~ /\.    { deny all; }
    location = /config.php { deny all; }

    access_log /var/log/nginx/api.mazier.website.access.log;
    error_log  /var/log/nginx/api.mazier.website.error.log;
}
