<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Locations</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 20px auto; padding: 0 16px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; margin: 8px 4px; }
    #map { height: 300px; width: 100%; margin: 16px 0; }
    li { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .del { background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    a { color: #0366d6; }
  </style>
  <!-- Leaflet (free map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <h2>📍 My Saved Locations</h2>
  <button onclick="saveCurrentLocation()">Save My Current Location</button>
  <button onclick="clearAll()">Clear All</button>

  <div id="map"></div>
  <ul id="list"></ul>

<script>
  const KEY = 'savedLocations';
  let map, markers = [];

  // Load from localStorage
  function getLocations() {
    return JSON.parse(localStorage.getItem(KEY) || '[]');
  }
  function saveLocations(locs) {
    localStorage.setItem(KEY, JSON.stringify(locs));
  }

  // Get user location and save
  function saveCurrentLocation() {
    if (!navigator.geolocation) {
      alert('Geolocation not supported');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        const loc = {
          id: Date.now(),
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
          time: new Date().toISOString(),
          note: prompt('Add a note (optional):') || ''
        };
        const locs = getLocations();
        locs.push(loc);
        saveLocations(locs);
        render();
      },
      err => alert('Error: ' + err.message),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  function clearAll() {
    if (confirm('Delete all saved locations?')) {
      localStorage.removeItem(KEY);
      render();
    }
  }

  function deleteLocation(id) {
    saveLocations(getLocations().filter(l => l.id !== id));
    render();
  }

  // Render list + map markers
  function render() {
    const locs = getLocations();
    const list = document.getElementById('list');
    list.innerHTML = locs.map(l => `
      <li>
        <div>
          <a href="https://www.google.com/maps?q=${l.lat},${l.lng}" target="_blank">
            ${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}
          </a>
          <div style="font-size:12px;color:#666">
            ${new Date(l.time).toLocaleString()} ${l.note ? '• ' + l.note : ''}
          </div>
        </div>
        <button class="del" onclick="deleteLocation(${l.id})">✕</button>
      </li>
    `).join('') || '<li>No locations saved yet.</li>';

    // Update markers
    markers.forEach(m => map.removeLayer(m));
    markers = locs.map(l => L.marker([l.lat, l.lng]).addTo(map).bindPopup(l.note || 'Saved location'));
    if (locs.length) {
      map.fitBounds(L.latLngBounds(locs.map(l => [l.lat, l.lng])), { padding: [30, 30] });
    }
  }

  // Init map
  map = L.map('map').setView([0, 0], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  render();
</script>
</body>
</html>
