<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل أطباء التأمين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#23324A; --muted:#62718A; --line:#D6DDE7;
  --bar:#7089B0; --bar-ink:#FFFFFF; --accent:#4A6696; --accent-ink:#FFFFFF;
  --teal:#2A7F7A; --zebra:#E6EAF0; --soft:#E3EEF0; --amber:#8A5A12; --amber-soft:#F7EEDC;
  --ff:"Readex Pro", "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121A26; --surface:#1A2433; --ink:#E4EAF3; --muted:#9AA8BE; --line:#2A374B;
    --bar:#4A6696; --bar-ink:#FFFFFF; --accent:#7F9CCB; --accent-ink:#0E1624;
    --teal:#5CB8B0; --zebra:#202C3E; --soft:#1C3336; --amber:#E8B266; --amber-soft:#3A2A14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A26; --surface:#1A2433; --ink:#E4EAF3; --muted:#9AA8BE; --line:#2A374B;
  --bar:#4A6696; --bar-ink:#FFFFFF; --accent:#7F9CCB; --accent-ink:#0E1624;
  --teal:#5CB8B0; --zebra:#202C3E; --soft:#1C3336; --amber:#E8B266; --amber-soft:#3A2A14; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 180px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:16px;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding:0 18px}

header.top{padding:34px 0 18px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(28px,6vw,42px);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
.net{font-size:14px;color:var(--muted);font-weight:400}
.lede{color:var(--muted);margin:8px 0 0;font-size:15px}

.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;font:inherit;font-size:17px;padding:13px 44px 13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
select{font:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);min-width:150px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:14px;border:0;background:none;color:var(--muted);padding:10px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.areas{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.chip{flex:0 0 auto;font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.chip b{font-weight:500;color:var(--muted);margin-inline-start:6px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.8}

.status{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);padding:14px 0 4px}
.status button{font:inherit;font-size:14px;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px}

section.group{margin:18px 0 8px}
.group h2{font-size:20px;font-weight:600;margin:0 0 8px;display:flex;align-items:baseline;gap:10px}
.group h2 span{font-size:13px;font-weight:400;color:var(--muted)}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li.item{display:grid;grid-template-columns:1fr auto;gap:12px 18px;align-items:center;padding:20px 22px;border-top:1px solid var(--line)}
li.item:first-child{border-top:0}
.name{font-size:19px;font-weight:600;line-height:1.4}
.meta{font-size:15px;color:var(--muted);display:flex;gap:8px 14px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:13px;padding:3px 10px;border-radius:6px;background:var(--soft);color:var(--accent);font-weight:500}
.tag.clinic{background:var(--amber-soft);color:var(--amber)}
.note{grid-column:1/-1;font-size:14px;color:var(--amber);background:var(--amber-soft);padding:10px 14px;border-radius:8px;margin-top:4px}
.actions{display:flex;gap:10px;align-items:center}
.call{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--accent);color:var(--accent-ink);padding:12px 18px;border-radius:10px;font-weight:500;font-size:16px;white-space:nowrap}
.call .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.map{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1.5px solid var(--line);border-radius:10px;color:var(--muted)}
.map:hover{color:var(--accent);border-color:var(--accent)}

.themeBtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.themeBtn:hover{color:var(--ink);border-color:var(--bar)}
.themeBtn svg{width:16px;height:16px}
.topbar{display:flex;justify-content:flex-end;padding:10px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
footer{color:var(--muted);font-size:13px;padding:28px 0 36px}

@media (max-width:560px){
  li.item{grid-template-columns:1fr}
  .actions{justify-content:flex-start}
  .call{flex:1;justify-content:center}
  select{flex:1}
}

/* MedNet brochure look */
header.top{padding:28px 0 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.logo{display:flex;flex-direction:column;align-items:flex-start;direction:ltr;color:var(--teal);flex:0 0 auto}
.logo .dots{display:grid;grid-template-columns:repeat(9,5px);gap:3px;margin-bottom:4px}
.logo .dots i{width:5px;height:5px;border-radius:50%;background:var(--teal);opacity:.85}
.logo .dots i.o{opacity:.25}
.logo .word{font-size:28px;font-weight:600;line-height:1;letter-spacing:-.01em}
.logo .tag2{font-size:9px;color:var(--muted);margin-top:3px}
h1{color:var(--ink)}
.group h2{background:var(--bar);color:var(--bar-ink);border-radius:999px;padding:8px 18px;font-size:18px;margin:0 0 10px}
.group h2 span{color:var(--bar-ink);opacity:.85}
ul.list{background:transparent;border:0;border-radius:0;overflow:visible;display:flex;flex-direction:column;gap:10px}
li.item{background:var(--surface);border:0;border-radius:16px;border-top:0}
li.item:nth-child(even){background:var(--zebra)}
.tag{background:var(--soft);color:var(--teal)}
.controls{border-bottom:3px solid var(--bar)}
.seg button[aria-pressed="true"]{background:var(--bar);color:var(--bar-ink)}
.map:hover{color:var(--teal);border-color:var(--teal)}
footer{border-top:1px solid var(--line);margin-top:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer .site{direction:ltr;color:var(--accent)}
@media (max-width:560px){ header.top{flex-direction:column;align-items:flex-start} }
</style>
</head>

<div class="wrap">

  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<main class="wrap">
  <div class="status"><span id="count" aria-live="polite"></span><button id="reset" hidden>مسح الفلاتر</button></div>
  <div id="results"></div>
  <footer id="foot"></footer>
</main>

    P = dedupe(list).map((p,i)=>({id:p.id||i+1, doctor:"", notes:"", ...p}));
    DATA.meta.specialties = [...new Set(P.map(p=>p.specialty).filter(Boolean))];
    rebuildFilters();
    update();
  } catch (e) { /* ما في ملف، بنكمل بالبيانات المدمجة */ }
})();

function dedupe(list){
  const seen = new Set(), out = [];
  for (const p of list) {
    const key = [p.name, (p.phone||"").replace(/\D/g,""), p.address||p.area].join("|");
    if (seen.has(key)) continue;
    seen.add(key); out.push(p);
  }
  return out;
}
const state = {q:"", gov:"", spec:"", area:"", type:""};

const norm = s => (s||"").toString()
  .replace(/[\u064B-\u0652\u0640]/g,"")
  .replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
  .toLowerCase().trim();

document.getElementById("net").textContent = "شبكة " + (P[0]?.network || "");
document.getElementById("foot").innerHTML = `<span>المصدر: ${DATA.meta.source}. تأكد من قبول التأمين بالاتصال قبل الزيارة.</span><span class="site">www.mednet.com</span>`;
// dotted mark (wave pattern like the MedNet logo)
document.getElementById("dots").innerHTML = Array.from({length:27},(_,i)=>{const r=Math.floor(i/9),c=i%9;const on=[[0,2,5,8],[1,3,4,6,7],[0,2,5,8]][r].includes(c);return `<i class="${on?"":"o"}"></i>`}).join("");

// specialty select
const spec = document.getElementById("spec");

// governorate select
const govSel = document.getElementById("gov");
function rebuildFilters(){
  const counts = {}; P.forEach(p=>{ if(p.city) counts[p.city]=(counts[p.city]||0)+1; });
  const cs = Object.keys(counts).sort((a,b)=> (a==="عمّان"?-1:b==="عمّان"?1:counts[b]-counts[a] || a.localeCompare(b,"ar")));
  govSel.innerHTML = `<option value="">كل المحافظات</option>` + cs.map(c=>`<option value="${c}">${c} (${counts[c]})</option>`).join("");
  govSel.value = state.gov || "";
  const sc = {}; P.forEach(p=>{ if(p.specialty) sc[p.specialty]=(sc[p.specialty]||0)+1; });
  const sp = Object.keys(sc).sort((a,b)=> sc[b]-sc[a] || a.localeCompare(b,"ar"));
  spec.innerHTML = `<option value="">كل الاختصاصات (${P.length})</option>` +
    sp.map(s=>`<option value="${s}">${s} (${sc[s]})</option>`).join("");
  spec.value = (sp.length === 1) ? (state.spec = sp[0]) : (state.spec || "");
}
const cityCounts = {}; P.forEach(p=>{ if(p.city) cityCounts[p.city]=(cityCounts[p.city]||0)+1; });
const cities = Object.keys(cityCounts).sort((a,b)=> (a==="عمّان"?-1:b==="عمّان"?1:cityCounts[b]-cityCounts[a] || a.localeCompare(b,"ar")));
govSel.innerHTML = `<option value="">كل المحافظات</option>` + cities.map(c=>`<option value="${c}">${c} (${cityCounts[c]})</option>`).join("");
govSel.addEventListener("change", ()=>{ state.gov = govSel.value; state.area=""; update(); });

// area chips with counts
const areasEl = document.getElementById("areas");
function renderChips(){
  const base = P.filter(p => (!state.spec || p.specialty===state.spec) && (!state.type || p.type===state.type) && (!state.gov || p.city===state.gov));
  const counts = {}; base.forEach(p => counts[p.area]=(counts[p.area]||0)+1);
  const areas = Object.keys(counts).sort((a,b)=>a.localeCompare(b,"ar"));
  areasEl.innerHTML = `<button class="chip" data-area="" aria-pressed="${!state.area}">كل المناطق<b>${base.length}</b></button>` +
    areas.map(a=>`<button class="chip" data-area="${a}" aria-pressed="${state.area===a}">${a}<b>${counts[a]}</b></button>`).join("");
}
areasEl.addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  state.area = b.dataset.area; update();
  b.scrollIntoView({inline:"nearest",block:"nearest"});
});

document.querySelector(".seg").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.type = b.dataset.type;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  update();
});
spec.addEventListener("change", ()=>{ state.spec = spec.value; update(); });
document.getElementById("q").addEventListener("input", e=>{ state.q = e.target.value; update(); });
document.getElementById("reset").addEventListener("click", ()=>{
  state.q=""; state.area=""; state.type=""; state.gov=""; govSel.value="";
  state.spec = DATA.meta.specialties.length===1 ? DATA.meta.specialties[0] : "";
  document.getElementById("q").value=""; spec.value=state.spec;
  document.querySelectorAll(".seg button").forEach((x,i)=>x.setAttribute("aria-pressed", i===0));
  update();
});

const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const phoneIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>`;
const pinIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>`;

function item(p){
  const tel = p.phone_dial || p.phone;
  const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${p.name} ${p.area} عمان`);
  return `<li class="item">
    <div>
      <div class="name">${esc(p.name)}</div>
      <div class="meta">
        ${p.doctor ? `<span>${esc(p.doctor)}</span>` : ""}
        <span>${esc(p.address)}</span>
        <span class="tag ${p.type==="clinic"?"clinic":""}">${p.type==="clinic"?"عيادة":"طبيب"}${p.specialty?" · "+esc(p.specialty):""}</span>
      </div>
    </div>
    <div class="actions">
      <a class="call" href="tel:${tel}" data-num="${esc(p.phone)}" aria-label="اتصل بـ ${esc(p.name)} — ${esc(p.phone)}">${phoneIcon}<span class="num">${esc(p.phone)}</span></a>
      <a class="map" href="${maps}" target="_blank" rel="noopener" aria-label="موقع ${esc(p.name)} على الخريطة">${pinIcon}</a>
    </div>
    ${p.notes ? `<div class="note">${esc(p.notes)}</div>` : ""}
  </li>`;
}

// light / dark / auto
const THEMES=[
 {k:"auto", label:"تلقائي", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>'},
 {k:"light", label:"نهاري", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>'},
 {k:"dark", label:"ليلي", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>'}
];
let themeIdx = 0;
try{ const s=localStorage.getItem("theme"); const i=THEMES.findIndex(t=>t.k===s); if(i>-1) themeIdx=i; }catch(e){}
function applyTheme(){
  const t=THEMES[themeIdx];
  if(t.k==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t.k);
  const btn=document.getElementById("themeBtn");
  btn.innerHTML = t.icon + `<span>${t.label}</span>`;
  btn.title = "الوضع: " + t.label;
  try{ localStorage.setItem("theme", t.k); }catch(e){}
}
document.getElementById("themeBtn").addEventListener("click", ()=>{ themeIdx=(themeIdx+1)%THEMES.length; applyTheme(); });
applyTheme();

let toastTimer;
function toast(msg){
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),2200);
}
function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  }catch(e){}
  return new Promise(res=>{
    const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:-1000px"; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta); res();
  });
}
document.addEventListener("click", e=>{
  const a=e.target.closest("a.call"); if(!a) return;
  const num=a.dataset.num||"";
  copyText(num).then(()=>toast("تم نسخ الرقم " + num)).catch(()=>toast("الرقم: " + num));
  // try to hand off to the phone dialer; harmless if the browser blocks it
  try{ window.open(a.href, "_self"); }catch(err){}
  e.preventDefault();
});

function update(){
  renderChips();
  const q = norm(state.q);
  const list = P.filter(p =>
    (!state.spec || p.specialty===state.spec) &&
    (!state.gov || p.city===state.gov) &&
    (!state.area || p.area===state.area) &&
    (!state.type || p.type===state.type) &&
    (!q || norm(`${p.name} ${p.doctor} ${p.address} ${p.phone}`).includes(q))
  );
  const groups = {};
  list.forEach(p => (groups[p.area] ||= []).push(p));
  const out = document.getElementById("results");
  if (!list.length){
    out.innerHTML = `<div class="empty"><strong>ما في نتائج</strong>جرّب منطقة ثانية أو امسح البحث.</div>`;
  } else {
    const cityRank = c => c==="عمّان" ? 0 : 1;
    out.innerHTML = Object.keys(groups).sort((a,b)=>{
      const ca=groups[a][0].city||"", cb=groups[b][0].city||"";
      return cityRank(ca)-cityRank(cb) || ca.localeCompare(cb,"ar") || a.localeCompare(b,"ar");
    }).map(a =>
      `<section class="group"><h2>${esc(a)}<span>${esc(groups[a][0].city||"")} · ${groups[a].length}</span></h2><ul class="list">${groups[a].map(item).join("")}</ul></section>`
    ).join("");
  }
  document.getElementById("count").textContent = `${list.length} من ${P.length} مقدم خدمة`;
  const dirty = state.q || state.area || state.type || state.gov || (DATA.meta.specialties.length>1 && state.spec);
  document.getElementById("reset").hidden = !dirty;
}
P = dedupe(P);
rebuildFilters();
update();
</script>
</body>
</html>
